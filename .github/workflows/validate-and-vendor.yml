name: Verify and bundle isolated Tapo TPAP v2

on:
  push:
    branches: [feature/hacs-standalone]
    paths:
      - '.github/workflows/validate-and-vendor.yml'
      - 'tools/build_vendor_kasa.py'
      - 'custom_components/tapo_tpap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this HACS integration
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout known TPAP v2 implementation
        uses: actions/checkout@v4
        with:
          repository: ZeliardM/python-kasa
          ref: e7084472972f08f2e2235b342f3964aedbfaeb3b
          path: upstream-tpap
          persist-credentials: false

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vendor upstream without touching HA's installed kasa
        run: |
          python tools/build_vendor_kasa.py --source upstream-tpap
          python -m compileall -q custom_components/tapo_tpap
          python -m pip install --quiet 'aiohttp>=3' 'asyncclick>=8.1.7,<10' 'cryptography>=3' 'mashumaro>=3.20,<4' 'ecdsa>=0.19.1,<1' 'passlib>=1.7.4,<2'

      - name: Validate private Python imports
        run: |
          python - <<'PY'
          import pathlib, sys, types
          for name, loc in [
              ("custom_components", "custom_components"),
              ("custom_components.tapo_tpap", "custom_components/tapo_tpap"),
              ("custom_components.tapo_tpap._vendor", "custom_components/tapo_tpap/_vendor"),
          ]:
              mod = types.ModuleType(name)
              mod.__path__ = [str(pathlib.Path(loc).resolve())]
              sys.modules[name] = mod
          from custom_components.tapo_tpap._vendor.kasa import Discover, Credentials
          assert Discover is not None and Credentials is not None
          assert "kasa" not in sys.modules, "Shared global kasa module imported"
          print("PASS: isolated TPAP imports without loading global kasa")
          PY

      - name: Commit isolated vendored code to feature branch
        if: github.event_name == 'push' && github.ref_name == 'feature/hacs-standalone'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f custom_components/tapo_tpap/_vendor
          if ! git diff --cached --quiet; then
            git commit -m "Vendor SHA-pinned TPAP library under private namespace"
            git push origin "HEAD:feature/hacs-standalone"
          else
            echo "Vendored code already matches pinned upstream"
          fi

      - name: Package preview
        run: |
          mkdir -p dist
          zip -q -r dist/tapo-tpap-preview.zip custom_components/tapo_tpap hacs.json README.md
          echo "Preview; runtime not yet validated inside Home Assistant OS" > dist/STATUS.txt

      - name: Upload preview archive
        uses: actions/upload-artifact@v4
        with:
          name: tapo-tpap-hacs-preview
          path: dist/
